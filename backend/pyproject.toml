[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-trading-assistant"
version = "0.1.0"
description = "Professional AI Trading Assistant — Multi-agent, multi-exchange, multi-LLM"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "AI Trading Assistant Team" }]

dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.9",

    # Async
    "anyio>=4.6.0",
    "httpx>=0.27.0",

    # Data Validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.10",  # For Alembic sync

    # Cache / Messaging
    "redis[hiredis]>=5.2.0",

    # Market Data
    "ccxt>=4.4.0",
    "pandas>=2.2.0",
    "numpy>=2.1.0",
    # "pandas-ta>=0.3.14b",  # TA without native deps for initial setup


    # Backtesting
    "vectorbt>=0.26.2",

    # LLM Providers
    "openai>=1.54.0",
    "anthropic>=0.37.0",
    "google-genai>=2.0.0",
    "ollama>=0.4.0",

    # Security
    "cryptography>=43.0.3",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # Observability
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-exporter-otlp>=1.28.0",
    "sentry-sdk[fastapi]>=2.18.0",

    # Utilities
    "python-dotenv>=1.0.1",
    "orjson>=3.10.11",
    "arrow>=1.3.0",
    "tenacity>=9.0.0",
    "slowapi>=0.1.9",
    "apscheduler>=3.10.4",
    "websockets>=13.1",
    "aiofiles>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "pytest-httpx>=0.33.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.1",
    "faker>=30.8.2",
    "time-machine>=2.16.0",
    "ruff==0.17.1",
    "mypy==2.4.0",
    "types-redis>=4.6.0",
    "pre-commit>=4.0.1",
    "aiosqlite>=0.20.0",
]

# ---------------------------------------------------------------------------
# Ruff — linting + formatting (replaces flake8, isort, black, pyupgrade)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in default arguments (FastAPI DI)
    "ARG002", # unused method argument (abstract interfaces)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.flake8-type-checking]
# Pydantic and SQLAlchemy resolve annotations at runtime when building models
# and mappers, so imports used in their fields must stay at module level.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
    "sqlalchemy.orm.DeclarativeBase",
    "src.infrastructure.persistence.database.Base",
]

[tool.ruff.lint.per-file-ignores]
# FastAPI resolves endpoint annotations at route-registration time.
"src/interfaces/api/**" = ["TC001", "TC002", "TC003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# MyPy — strict static type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
no_implicit_reexport = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/", "tests/"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=70",
]
markers = [
    "unit: Pure unit tests (no I/O)",
    "integration: Tests that require database or external services",
    "e2e: End-to-end tests against a running server",
    "slow: Tests that take more than 1 second",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

# ---------------------------------------------------------------------------
# Hatch build
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src"]
